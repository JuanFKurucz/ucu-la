<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 340' width='1180' height='340' role='img'><title>La API como un mostrador: pedís modelo, mensajes y tope con tu clave, y te atienden con el texto y la cuenta de tokens. La analogía falla en que el mostrador no te recuerda: cada pedido empieza de cero</title><defs><marker id='pmo' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#233c9e'/></marker></defs><rect x='10' y='10' width='540' height='230' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(38,32) scale(2.5)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M8 9l3 3l-3 3" /><path d="M13 15l3 0" /><path d="M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -12" /></g><text x='118' y='76' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='34' font-weight='700' fill='#1f2937'>Pedís</text><text x='40' y='150' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='600' fill='#1f2937'>modelo, mensajes y tope,</text><text x='40' y='188' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='600' fill='#1f2937'>con tu clave (dice quién sos)</text><rect x='630' y='10' width='540' height='230' rx='22' fill='#fff1e6' stroke='#d9480f' stroke-width='2'/><g transform='translate(658,32) scale(2.5)' fill='none' stroke='#d9480f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M3.6 9h16.8" /><path d="M3.6 15h16.8" /><path d="M11.5 3a17 17 0 0 0 0 18" /><path d="M12.5 3a17 17 0 0 1 0 18" /></g><text x='738' y='76' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='34' font-weight='700' fill='#1f2937'>Te atienden</text><text x='660' y='150' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='600' fill='#1f2937'>con el texto y la cuenta:</text><text x='660' y='188' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='600' fill='#1f2937'>cuántos tokens usó</text><path d='M556 125 H622' stroke='#233c9e' stroke-width='5' marker-end='url(#pmo)'/><rect x='10' y='262' width='1160' height='66' rx='16' fill='#ffffff' stroke='#d9480f' stroke-width='2' stroke-dasharray='10 6'/><g transform='translate(28,276) scale(1.5833333333333333)' fill='none' stroke='#d9480f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M12 9v4" /><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" /><path d="M12 16h.01" /></g><text x='80' y='304' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>Donde falla: el mostrador no te recuerda. Cada pedido empieza de cero.</text></svg>