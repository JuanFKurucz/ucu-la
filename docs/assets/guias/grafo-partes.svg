<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 320' width='1180' height='320' role='img'><title>Un grafo: cada caja es un nodo (una función de Python), cada flecha dice qué paso sigue y el estado es un diccionario que pasa de caja en caja</title><rect x='10' y='10' width='367' height='300' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(163.33333333333334,32) scale(2.5)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M6 9a6 6 0 1 0 12 0a6 6 0 0 0 -12 0" /><path d="M12 3c1.333 .333 2 2.333 2 6s-.667 5.667 -2 6" /><path d="M12 3c-1.333 .333 -2 2.333 -2 6s.667 5.667 2 6" /><path d="M6 9h12" /><path d="M3 20h7" /><path d="M14 20h7" /><path d="M10 20a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M12 15v3" /></g><text x='193.33333333333334' y='136' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Nodo</text><text x='193.33333333333334' y='178' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>cada caja: una función</text><text x='193.33333333333334' y='206' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>de Python</text><rect x='407' y='10' width='367' height='300' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(560.0,32) scale(2.5)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M12 21v-13a4 4 0 1 0 -4 4h13" /><path d="M17 16l4 -4l-4 -4" /></g><text x='590.0' y='136' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Flecha</text><text x='590.0' y='178' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>qué paso sigue, a veces</text><text x='590.0' y='206' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>según una decisión</text><rect x='803' y='10' width='367' height='300' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(956.6666666666667,32) scale(2.5)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 14l2 2l4 -4" /></g><text x='986.6666666666667' y='136' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Estado</text><text x='986.6666666666667' y='178' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>un diccionario que pasa</text><text x='986.6666666666667' y='206' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>de caja en caja, como</text><text x='986.6666666666667' y='234' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>una carpeta</text></svg>