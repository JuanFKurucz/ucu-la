<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 397' width='1024' height='397' role='img'><title>Tres niveles de «está bien»: válido (se lee como JSON), conforme (tiene los campos y tipos del molde, lo controla Pydantic) y correcto (el dato es verdadero, lo controlás vos)</title><rect x='10' y='90' width='320' height='253' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(141.0,110) scale(2.4166666666666665)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /><path d="M9 17l0 -5" /><path d="M12 17l0 -1" /><path d="M15 17l0 -3" /></g><text x='170.0' y='202' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#3b5bdb'>1</text><text x='170.0' y='236' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>Válido</text><text x='170.0' y='270' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>¿se lee como JSON? Lo</text><text x='170.0' y='295' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>controla el molde</text><path d='M333 222.5 L349 192.5' stroke='#5f6b7a' stroke-width='3'/><rect x='352' y='60' width='320' height='253' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(483.0,80) scale(2.4166666666666665)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" /><path d="M9 14l2 2l4 -4" /></g><text x='512.0' y='172' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#3b5bdb'>2</text><text x='512.0' y='206' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>Conforme</text><text x='512.0' y='240' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>¿tiene los campos y</text><text x='512.0' y='265' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>tipos? También el</text><text x='512.0' y='290' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>molde (Pydantic)</text><path d='M675 192.5 L691 162.5' stroke='#5f6b7a' stroke-width='3'/><rect x='694' y='30' width='320' height='253' rx='22' fill='#fff1e6' stroke='#d9480f' stroke-width='2'/><g transform='translate(825.0,50) scale(2.4166666666666665)' fill='none' stroke='#d9480f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M5 12l5 5l10 -10" /></g><text x='854.0' y='142' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#d9480f'>3</text><text x='854.0' y='176' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>Correcto</text><text x='854.0' y='210' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>¿el dato es verdadero?</text><text x='854.0' y='235' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>Lo controlás vos,</text><text x='854.0' y='260' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='400' fill='#5f6b7a'>contra el texto</text><text x='512.0' y='377' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='600' fill='#5f6b7a'>El molde controla los dos primeros; el tercero, vos. Pasar uno no garantiza el siguiente.</text></svg>