<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 390' width='1200' height='390' role='img'><title>Una caché: llega la consulta; si es igual a una anterior, vuelve la respuesta guardada sin llamar al modelo; si no, responde el modelo y la respuesta se guarda. Riesgo: devolver algo viejo, o equivocado si compara por parecido</title><defs><marker id='pcache' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5f6b7a'/></marker></defs><rect x='20' y='125' width='250' height='110' rx='20' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(42,145) scale(1.8333333333333333)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12" /><path d="M9.5 9h.01" /><path d="M14.5 9h.01" /><path d="M9.5 13a3.5 3.5 0 0 0 5 0" /></g><text x='100' y='175' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='700' fill='#1f2937'>Consulta</text><text x='42' y='217' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='600' fill='#5f6b7a'>la pregunta</text><path d='M272 180 H352' stroke='#5f6b7a' stroke-width='3' marker-end='url(#pcache)'/><polygon points='480,95 605,180 480,265 355,180' fill='#f6f8fc' stroke='#233c9e' stroke-width='2'/><text x='480' y='172' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>¿Igual a</text><text x='480' y='202' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>una anterior?</text><path d='M600 168 L708 100' stroke='#2b8a3e' stroke-width='3' marker-end='url(#pcache)'/><path d='M600 192 L708 262' stroke='#3b5bdb' stroke-width='3' marker-end='url(#pcache)'/><text x='642' y='118' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#2b8a3e'>Sí</text><text x='642' y='258' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#3b5bdb'>No</text><rect x='715' y='30' width='465' height='120' rx='20' fill='#ebfbee' stroke='#2b8a3e' stroke-width='2'/><g transform='translate(737,50) scale(1.8333333333333333)' fill='none' stroke='#2b8a3e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M5 12l5 5l10 -10" /></g><text x='795' y='80' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='700' fill='#1f2937'>La respuesta guardada</text><text x='737' y='122' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='600' fill='#5f6b7a'>sin llamar al modelo: no cuesta nada</text><rect x='715' y='210' width='465' height='120' rx='20' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(737,230) scale(1.8333333333333333)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8" /><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8" /><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5" /><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0" /><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5" /><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10" /></g><text x='795' y='260' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='25' font-weight='700' fill='#1f2937'>El modelo</text><text x='737' y='302' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='600' fill='#5f6b7a'>responde, y la respuesta se guarda</text><text x='600' y='372' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' 