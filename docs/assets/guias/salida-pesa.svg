<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 318' width='1180' height='318' role='img'><title>500 tokens de entrada y 200 de salida: en tokens gana la entrada, pero en costo gana la salida (US$ 0,00005 contra 0,00008), porque cada token de salida cuesta 4 veces más con estos precios</title><rect x='10' y='10' width='570' height='250' rx='22' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='38' y='54' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Tokens</text><text x='38' y='122' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#5f6b7a'>entrada</text><rect x='140' y='96' width='250' height='38' rx='8' fill='#3b5bdb'/><text x='400.0' y='124' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#1f2937'>500</text><text x='38' y='202' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#5f6b7a'>salida</text><rect x='140' y='176' width='100' height='38' rx='8' fill='#d9480f'/><text x='250.0' y='204' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#1f2937'>200</text><rect x='600' y='10' width='570' height='250' rx='22' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='628' y='54' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Costo</text><text x='628' y='122' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#5f6b7a'>entrada</text><rect x='730' y='96' width='156' height='38' rx='8' fill='#3b5bdb'/><text x='896.25' y='124' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#1f2937'>US$ 0,00005</text><text x='628' y='202' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#5f6b7a'>salida</text><rect x='730' y='176' width='250' height='38' rx='8' fill='#d9480f'/><text x='990.0' y='204' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#1f2937'>US$ 0,00008</text><text x='590' y='300' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#5f6b7a'>Con estos precios, cada token de salida cuesta 4 veces más. En Gemini 3.5 Flash-Lite (19/10), 8.</text></svg>