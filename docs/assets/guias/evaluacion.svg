<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 300' width='1200' height='300' role='img'><title>La nota: el factor de la defensa (1, 0,8, 0,5 o 0) multiplica la suma del proyecto final (60) y los 3 check-ins (30, 10 cada uno); después se suman los 3 iRAT (10)</title><rect x='20' y='40' width='210' height='130' rx='16' fill='#3b5bdb'/><text x='125.0' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='40' font-weight='700' fill='#ffffff'>factor</text><text x='125.0' y='214' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='26' font-weight='700' fill='#1f2937'>Defensa</text><rect x='330' y='40' width='370' height='130' rx='16' fill='#233c9e'/><text x='515.0' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#ffffff'>60</text><text x='515.0' y='214' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='26' font-weight='700' fill='#1f2937'>Proyecto final</text><rect x='760' y='40' width='200' height='130' rx='16' fill='#d9480f'/><text x='860.0' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#ffffff'>30</text><text x='860.0' y='214' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='26' font-weight='700' fill='#1f2937'>3 check-ins</text><rect x='1070' y='40' width='110' height='130' rx='16' fill='#5f6b7a'/><text x='1125.0' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#ffffff'>10</text><text x='1125.0' y='214' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='26' font-weight='700' fill='#1f2937'>3 iRAT</text><text x='266' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#1f2937'>×</text><text x='305' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#1f2937'>(</text><text x='730' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#1f2937'>+</text><text x='990' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#1f2937'>)</text><text x='1035' y='124' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='52' font-weight='700' fill='#1f2937'>+</text><text x='600' y='280' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='600' fill='#1f2937'>El factor sale de la defensa: 1 si la defendés bien · 0,8 con dudas · 0,5 si no explicás tu código · 0 si no es tuyo</text></svg>