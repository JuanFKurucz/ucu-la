<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 300' width='1180' height='300' role='img'><title>Línea de tiempo de una respuesta con Ollama local: sin streaming esperás sin ver nada y llega toda junta al final; con streaming la primera palabra llega a 1,1 s y los 52 pedazos siguen hasta 1,5 s, el mismo final</title><text x='250' y='30' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='18' font-weight='600' fill='#5f6b7a'>0 s</text><text x='1120.0' y='30' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='18' font-weight='600' fill='#5f6b7a'>1,5 s</text><text x='888.0' y='30' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='18' font-weight='600' fill='#5f6b7a'>1,1 s</text><line x1='250' y1='40' x2='250' y2='250' stroke='#cfd8e3' stroke-width='2' stroke-dasharray='4 6'/><line x1='888' y1='40' x2='888' y2='250' stroke='#cfd8e3' stroke-width='2' stroke-dasharray='4 6'/><line x1='1120' y1='40' x2='1120' y2='250' stroke='#cfd8e3' stroke-width='2' stroke-dasharray='4 6'/><text x='20' y='98' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>Sin streaming</text><rect x='250' y='70' width='870' height='40' rx='8' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='685.0' y='97' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='600' fill='#5f6b7a'>esperás sin ver nada</text><rect x='1114' y='62' width='36' height='56' rx='8' fill='#3b5bdb'/><text x='1150.0' y='142' text-anchor='end' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='700' fill='#233c9e'>toda junta</text><text x='20' y='198' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'>Con streaming</text><rect x='250' y='170' width='638' height='40' rx='8' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='569.0' y='197' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='20' font-weight='600' fill='#5f6b7a'>esperás la 1.ª palabra</text><rect x='888' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='904' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='921' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='938' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='954' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='970' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='987' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1004' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1020' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1036' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1053' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1070' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1086' y='170' width='12' height='40' rx='3' fill='#d9480f'/><rect x='1102' y='170' width='12' height='40' rx='3' fill='#d9480f'/><text x='1004.0' y='236' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='18' font-weight='700' fill='#d9480f'>52 pedazos</text><text x='590' y='282' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#5f6b7a'>Ollama local: la 1.ª palabra a 1,1 s y completa a 1,5 s. Ves antes; no termina antes.</text></svg>