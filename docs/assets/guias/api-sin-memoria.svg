<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 320' width='1180' height='320' role='img'><title>La API no recuerda: cada llamada empieza de cero; la memoria es la aplicación reenviando toda la conversación; ¿qué pasa si dos personas la usan a la vez?</title><rect x='10' y='10' width='367' height='300' rx='22' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(163.33333333333334,32) scale(2.5)' fill='none' stroke='#3b5bdb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M4 12v-3a3 3 0 0 1 3 -3h13m-3 -3l3 3l-3 3" /><path d="M20 12v3a3 3 0 0 1 -3 3h-13m3 3l-3 -3l3 -3" /></g><text x='193.33333333333334' y='136' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Cada llamada</text><text x='193.33333333333334' y='178' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>empieza de cero</text><rect x='407' y='10' width='367' height='300' rx='22' fill='#ebfbee' stroke='#2b8a3e' stroke-width='2'/><g transform='translate(560.0,32) scale(2.5)' fill='none' stroke='#2b8a3e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12" /><path d="M9.5 9h.01" /><path d="M14.5 9h.01" /><path d="M9.5 13a3.5 3.5 0 0 0 5 0" /></g><text x='590.0' y='136' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'>Memoria</text><text x='590.0' y='178' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>la aplicación reenvía</text><text x='590.0' y='206' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='400' fill='#1f2937'>toda la conversación</text><rect x='803' y='10' width='36