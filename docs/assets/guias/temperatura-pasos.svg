 0 -1 0" fill="currentColor" /><path d="M15 15.5a.5 .5 0 1 0 1 0a.5 .5 0 1 0 -1 0" fill="currentColor" /><path d="M8 15.5a.5 .5 0 1 0 1 0a.5 .5 0 1 0 -1 0" fill="currentColor" /><path d="M11.5 12a.5 .5 0 1 0 1 0a.5 .5 0 1 0 -1 0" fill="currentColor" /></g><text x='80' y='452' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='23' font-weight='700' fill='#1f2937'>Sortear: un dado cargado. Con playa al 75 %, sale playa unas 75 de cada 100 veces.</text><text x='590' y='516' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='24' font-weight='700' fill='#5f6b7a'>Cambia la variedad, no la verdad.</text></svg>