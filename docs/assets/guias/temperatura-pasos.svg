<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 534' width='1180' height='534' role='img'><title>La temperatura en tres pasos: el modelo da probabilidades (playa 75 %), T baja las estira (96 %) y T alta las aplana (48 %), y después se sortea una palabra</title><defs><marker id='pt' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5f6b7a'/></marker></defs><rect x='10' y='10' width='1160' height='62' rx='16' fill='#e3e9ff' stroke='#3b5bdb' stroke-width='2'/><g transform='translate(28,22) scale(1.5833333333333333)' fill='none' stroke='#233c9e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="" fill="none" /><path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M6 4v4" /><path d="M6 12v8" /><path d="M10 16a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M12 4v10" /><path d="M12 18v2" /><path d="M16 7a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M18 4v1" /><path d="M18 9v11" /></g><text x='80' y='50' text-anchor='start' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='23' font-weight='700' fill='#1f2937'>Temperatura (T): un número que estira o aplana las probabilidades antes de sortear.</text><rect x='10' y='92' width='280' height='300' rx='20' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='150' y='130' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#3b5bdb'>1. Lo que da el modelo</text><line x1='34' y1='312' x2='260' y2='312' stroke='#cfd8e3' stroke-width='2'/><rect x='40' y='199' width='34' height='113' rx='4' fill='#3b5bdb'/><rect x='84' y='297' width='34' height='15' rx='4' fill='#3b5bdb'/><rect x='128' y='298' width='34' height='14' rx='4' fill='#3b5bdb'/><rect x='172' y='306' width='34' height='6' rx='4' fill='#3b5bdb'/><rect x='216' y='309' width='34' height='3' rx='4' fill='#3b5bdb'/><text x='150' y='344' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#1f2937'>playa 75 %</text><text x='150' y='372' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='18' font-weight='400' fill='#5f6b7a'>costa, montaña, campo, ciudad</text><rect x='310' y='92' width='280' height='300' rx='20' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='450' y='130' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#233c9e'>2. T baja: se estira</text><line x1='334' y1='312' x2='560' y2='312' stroke='#cfd8e3' stroke-width='2'/><rect x='340' y='167' width='34' height='145' rx='4' fill='#233c9e'/><rect x='384' y='309' width='34' height='3' rx='4' fill='#3b5bdb'/><rect x='428' y='309' width='34' height='3' rx='4' fill='#3b5bdb'/><rect x='472' y='309' width='34' height='3' rx='4' fill='#3b5bdb'/><rect x='516' y='309' width='34' height='3' rx='4' fill='#3b5bdb'/><text x='450' y='344' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='22' font-weight='700' fill='#1f2937'>playa 97 %</text><text x='450' y='372' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='18' font-weight='400' fill='#5f6b7a'>costa, montaña, campo, ciudad</text><rect x='610' y='92' width='280' height='300' rx='20' fill='#f6f8fc' stroke='#cfd8e3' stroke-width='2'/><text x='750' y='130' text-anchor='middle' font-family='Segoe UI, Roboto, Arial, sans-serif' font-size='21' font-weight='700' fill='#d9480f'>2. T alta: se aplana</text><line x1='634' y1='312' x2='860' y2='312' stroke='#cfd8e3' stroke-width='2'/><rect x='640' y='240' width='34' height='72' rx='4' fill='#d9480f'/><rect x='684' y='285' width='34' height='27' rx='4' fill='#3b5bdb'/><rect x='728' y='287' width='34' height='25' rx='4' fill='#3b5bdb'/><rect x='772' y='295' width='34' height='17' rx='4' fill='#3b5bdb'/><rect x='816' y='303' width='34' height='9' rx='4' fill='#3b5bdb'/><text x='750' y='344' text-anchor='middle' font-family='